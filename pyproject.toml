[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eazypredict"
version = "0.3.0"
description = "Run and compare many scikit-learn models on a dataset in a few lines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Harshavardhan M", email = "harsha7vardhan@gmail.com" }]
keywords = ["machine-learning", "scikit-learn", "automl", "benchmarking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
boosters = ["xgboost>=2.0", "lightgbm>=4.0"]
plots = ["matplotlib>=3.7"]
all = ["eazypredict[boosters,plots]"]

[project.urls]
Homepage = "https://github.com/codevardhan/EazyPredict"
Changelog = "https://github.com/codevardhan/EazyPredict/blob/main/CHANGELOG.md"
Issues = "https://github.com/codevardhan/EazyPredict/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "pre-commit",
    "eazypredict[all]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eazypredict = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["slow: deselected by default; run with --runslow"]
filterwarnings = [
    "error::FutureWarning",
    "error::DeprecationWarning:eazypredict.*",
]

[tool.coverage.run]
source = ["eazypredict"]
branch = true

[tool.coverage.report]
# Applies only when coverage is actually collected, so a plain `pytest` stays fast.
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "NPY", "PD", "PT", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["src/eazypredict"]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "tqdm.*"]
ignore_missing_imports = true
